
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 2 3 I Love You ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050008;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

#text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: clamp(55px, 12vw, 130px);
    font-weight: bold;
    letter-spacing: 5px;
    text-align: center;
    white-space: nowrap;
    text-shadow:
        0 0 10px #fff,
        0 0 25px #ff4da6,
        0 0 50px #ff1493;
    opacity: 0;
    z-index: 5;
}

.fadeIn {
    animation: fadeIn 1s ease forwards;
}

.fadeOut {
    animation: fadeOut 1s ease forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.4);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes fadeOut {
    from {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }

    to {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.8);
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="text">1</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;

function resize() {

    const dpr = window.devicePixelRatio || 1;

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

resize();

window.addEventListener("resize", resize);

const text =
    document.getElementById("text");


let particles = [];

let heartParticles = [];

let heartTextParticles = [];


let sequence = [
    "1",
    "2",
    "3",
    "I",
    "LOVE",
    "YOU"
];

let current = 0;


/* =================================
   PARTIKEL LATAR
================================= */

let backgroundParticles = [];

for (let i = 0; i < 180; i++) {

    backgroundParticles.push({

        x: Math.random() * width,

        y: Math.random() * height,

        r: Math.random() * 2 + 0.5,

        speed:
            Math.random() * 0.5 + 0.1,

        alpha:
            Math.random()
    });
}


function drawBackground() {

    ctx.fillStyle =
        "rgba(5,0,8,0.25)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    backgroundParticles.forEach(p => {

        p.y -= p.speed;

        if (p.y < 0) {

            p.y = height;

            p.x =
                Math.random() * width;
        }


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            Math.random() > 0.5

            ? `rgba(
                255,
                255,
                255,
                ${p.alpha}
              )`

            : `rgba(
                255,
                80,
                170,
                ${p.alpha}
              )`;

        ctx.fill();

    });
}


/* =================================
   PARTIKEL TEKS AWAL
================================= */

function createTextParticles(word) {

    particles = [];

    const offscreen =
        document.createElement("canvas");

    const octx =
        offscreen.getContext("2d");


    offscreen.width = width;
    offscreen.height = height;


    let fontSize =
        Math.min(width / 3, 150);


    octx.font =
        `bold ${fontSize}px Arial`;

    octx.textAlign = "center";

    octx.textBaseline = "middle";

    octx.fillStyle = "white";


    octx.fillText(
        word,
        width / 2,
        height / 2
    );


    const data =
        octx.getImageData(
            0,
            0,
            width,
            height
        ).data;


    for (
        let y = 0;
        y < height;
        y += 6
    ) {

        for (
            let x = 0;
            x < width;
            x += 6
        ) {

            const index =
                (y * width + x) * 4;


            if (
                data[index + 3] > 150
            ) {

                particles.push({

                    x:
                        Math.random() * width,

                    y:
                        Math.random() * height,

                    targetX: x,

                    targetY: y,

                    size:
                        Math.random() * 2 + 1,

                    speed:
                        0.04 +
                        Math.random() * 0.04
                });
            }
        }
    }
}


function animateTextParticles() {

    particles.forEach(p => {

        p.x +=
            (p.targetX - p.x) *
            p.speed;

        p.y +=
            (p.targetY - p.y) *
            p.speed;


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            Math.random() > 0.45

            ? "rgba(255,255,255,0.9)"

            : "rgba(255,60,160,0.9)";


        ctx.fill();

    });
}


/* =================================
   MEMBUAT HATI
================================= */

function createHeart() {

    heartParticles = [];


    const centerX =
        width / 2;

    const centerY =
        height / 2;


    const scale =
        Math.min(width, height) / 34;


    /* OUTLINE HATI */

    for (
        let t = 0;
        t < Math.PI * 2;
        t += 0.025
    ) {

        const x =
            16 *
            Math.pow(
                Math.sin(t),
                3
            );


        const y =
            -(
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t)
            );


        heartParticles.push({

            baseX:
                centerX + x * scale,

            baseY:
                centerY + y * scale,

            size:
                Math.random() * 2.5 + 1
        });
    }


    /* ISI HATI */

    for (let i = 0; i < 900; i++) {

        const t =
            Math.random() *
            Math.PI * 2;


        const x =
            16 *
            Math.pow(
                Math.sin(t),
                3
            );


        const y =
            -(
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t)
            );


        const factor =
            Math.sqrt(
                Math.random()
            );


        heartParticles.push({

            baseX:
                centerX +
                x * scale *
                factor,

            baseY:
                centerY +
                y * scale *
                factor,

            size:
                Math.random() * 2 + 0.5
        });
    }
}


/* =================================
   TULISAN TENGAH HATI
   I LOVE YOU
   EVA SOLEHA KU
================================= */

function createHeartTextParticles() {

    heartTextParticles = [];


    const offscreen =
        document.createElement("canvas");

    const octx =
        offscreen.getContext("2d");


    offscreen.width = width;
    offscreen.height = height;


    /*
       Ukuran tulisan
    */

    const fontSize =
        Math.min(
            width / 15,
            36
        );


    octx.font =
        `bold ${fontSize}px Arial`;

    octx.textAlign = "center";

    octx.textBaseline = "middle";

    octx.fillStyle = "white";


    /*
       BARIS PERTAMA
    */

    octx.fillText(
        "I LOVE YOU",
        width / 2,
        height / 2 - fontSize * 0.75
    );


    /*
       BARIS KEDUA
    */

    octx.fillText(
        "EVA DATUSSOLEHA KU ❤️",
        width / 2,
        height / 2 + fontSize * 0.75
    );


    const data =
        octx.getImageData(
            0,
            0,
            width,
            height
        ).data;


    /*
       Partikel rapat
       agar tulisan jelas
    */

    for (
        let y = 0;
        y < height;
        y += 3
    ) {

        for (
            let x = 0;
            x < width;
            x += 3
        ) {

            const index =
                (y * width + x) * 4;


            if (
                data[index + 3] > 150
            ) {

                heartTextParticles.push({

                    x:
                        Math.random() *
                        width,

                    y:
                        Math.random() *
                        height,

                    targetX: x,

                    targetY: y,

                    size:
                        Math.random() *
                        1.5 + 0.7
                });
            }
        }
    }
}


/* =================================
   ANIMASI TULISAN TENGAH
================================= */

function animateHeartTextParticles() {

    heartTextParticles.forEach(p => {

        p.x +=
            (p.targetX - p.x) *
            0.10;

        p.y +=
            (p.targetY - p.y) *
            0.10;


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );


        /*
           PUTIH SEMUA
        */

        ctx.fillStyle =
            "rgba(255,255,255,0.98)";


        ctx.shadowBlur = 6;

        ctx.shadowColor =
            "#ffffff";


        ctx.fill();


        ctx.shadowBlur = 0;

    });
}


/* =================================
   ANIMASI HATI
================================= */

let heartScale = 1;


function animateHeart() {

    /*
       Denyut hati
    */

    heartScale =
        1 +
        Math.sin(
            Date.now() * 0.003
        ) * 0.05;


    heartParticles.forEach(
        (p, index) => {

            const x =
                width / 2 +
                (p.baseX - width / 2) *
                heartScale;


            const y =
                height / 2 +
                (p.baseY - height / 2) *
                heartScale;


            ctx.beginPath();


            ctx.arc(
                x,
                y,
                p.size,
                0,
                Math.PI * 2
            );


            const color =
                index % 3 === 0
                ? "255,255,255"
                : "255,60,150";


            ctx.fillStyle =
                `rgba(
                    ${color},
                    0.9
                )`;


            ctx.shadowBlur = 10;

            ctx.shadowColor =
                "#ff1493";


            ctx.fill();


            ctx.shadowBlur = 0;

        }
    );


    /*
       Tulisan tetap 2D
       di tengah hati
    */

    animateHeartTextParticles();
}


/* =================================
   URUTAN ANIMASI
================================= */

function showNext() {

    if (
        current >=
        sequence.length
    ) {

        startHeart();

        return;
    }


    text.className = "";

    text.style.opacity = "0";


    setTimeout(() => {

        text.textContent =
            sequence[current];


        text.className =
            "fadeIn";


        createTextParticles(
            sequence[current]
        );


        setTimeout(() => {

            text.className =
                "fadeOut";


            current++;


            setTimeout(
                showNext,
                800
            );

        }, 1600);

    }, 300);
}


/* =================================
   MULAI HATI
================================= */

let heartMode = false;


function startHeart() {

    heartMode = true;

    text.style.opacity = "0";


    /*
       Buat hati
    */

    createHeart();


    /*
       Buat tulisan:

       I LOVE YOU
       EVA SOLEHA KU

       putih dan 2D
    */

    createHeartTextParticles();
}


/* =================================
   LOOP ANIMASI
================================= */

function animate() {

    drawBackground();


    if (!heartMode) {

        animateTextParticles();

    } else {

        animateHeart();

    }


    requestAnimationFrame(
        animate
    );
}


/* =================================
   MULAI PROGRAM
================================= */

createTextParticles("1");

animate();


setTimeout(
    showNext,
    1000
);

</script>

</body>
</html>
